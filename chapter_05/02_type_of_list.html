<!DOCTYPE html>
<html>
<head>
    <title>Ordered List Types</title>
</head>

<body>

    <h2>Types of Ordered List</h2>

    <h3>1. Number</h3>
    <ol type="1">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <h3>2. Uppercase Letters</h3>
    <ol type="A">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <h3>3. Lowercase Letters</h3>
    <ol type="a">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <h3>4. Uppercase Roman</h3>
    <ol type="I">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <h3>5. Lowercase Roman</h3>
    <ol type="i">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

</body>
</html>
